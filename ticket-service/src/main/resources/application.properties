spring.application.name=ticket-service

server.port=4016

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=org.envycorp.ticketservice.model.event.OrderCreatedEvent
spring.kafka.consumer.group-id=ticket-service
spring.kafka.bootstrap-servers=localhost:9092


spring.datasource.url=jdbc:mysql://localhost:3310/ticket_db
spring.datasource.username=ticket_user
spring.datasource.password=ticket_password
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.enabled=true

eureka.client.service-url.defaultZone=http://localhost:4017/eureka
eureka.instance.prefer-ip-address=true