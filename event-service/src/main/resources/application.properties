spring.application.name=inventory-service

server.port=4011

spring.datasource.url=jdbc:mysql://localhost:3306/events_db
spring.datasource.username=events_user
spring.datasource.password=events_password

spring.jpa.hibernate.ddl-auto=none

spring.profiles.active=dev

spring.liquibase.enabled=true

eureka.client.service-url.defaultZone=http://localhost:4017/eureka
eureka.instance.prefer-ip-address=true